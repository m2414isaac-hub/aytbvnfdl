<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>체스 묘수풀이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ece5d3;
    --panel: #fbf8f0;
    --panel-border: #d9d0ba;
    --board-light: #f4eedd;
    --board-dark: #4a5578;
    --board-frame: #2c3350;
    --accent-gold: #a97a2c;
    --accent-good: #4f7a54;
    --accent-bad: #a2483a;
    --text-primary: #211f2c;
    --text-muted: #6b6a7a;
    --select-ring: #a97a2c;
    --dot-color: #7a3b18;
    --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
    --sans: 'IBM Plex Sans KR', 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12141c;
      --panel: #1a1d2a;
      --panel-border: #2c3044;
      --board-light: #e9e1cc;
      --board-dark: #333d5c;
      --board-frame: #0c0e16;
      --accent-gold: #c9a24b;
      --accent-good: #7fa985;
      --accent-bad: #c17663;
      --text-primary: #f1ecdf;
      --text-muted: #9a98ab;
      --select-ring: #c9a24b;
      --dot-color: #e8b04a;
    }
  }

  :root[data-theme="dark"] {
    --bg: #12141c;
    --panel: #1a1d2a;
    --panel-border: #2c3044;
    --board-light: #e9e1cc;
    --board-dark: #333d5c;
    --board-frame: #0c0e16;
    --accent-gold: #c9a24b;
    --accent-good: #7fa985;
    --accent-bad: #c17663;
    --text-primary: #f1ecdf;
    --text-muted: #9a98ab;
    --select-ring: #c9a24b;
    --dot-color: #e8b04a;
  }

  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--sans);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-font-smoothing: antialiased;
  }

  .page { max-width: 980px; margin: 0 auto; padding: 40px 20px 64px; }

  header.top { margin-bottom: 32px; }

  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
  }

  header.top h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(28px, 4.5vw, 40px);
    letter-spacing: -0.01em;
    margin: 0 0 6px;
    color: var(--text-primary);
  }

  header.top p {
    margin: 0;
    color: var(--text-muted);
    font-size: 15px;
    max-width: 60ch;
    line-height: 1.6;
  }

  .lang-toggle {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .lang-btn {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--panel-border);
    background: var(--panel);
    color: var(--text-muted);
    cursor: pointer;
  }
  .lang-btn.active {
    border-color: var(--accent-gold);
    color: var(--accent-gold);
    font-weight: 600;
  }
  .lang-btn:focus-visible { outline: 2px solid var(--select-ring); outline-offset: 2px; }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 260px;
    gap: 28px;
    align-items: start;
  }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
  }

  .board-column { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

  .board-meta {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .difficulty-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--text-muted);
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    padding: 4px 12px;
    background: var(--panel);
  }
  .difficulty-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-gold); }
  .difficulty-dot.easy { background: var(--accent-good); }
  .difficulty-dot.hard { background: var(--accent-bad); }

  .prompt-text { font-size: 15px; color: var(--text-primary); font-weight: 500; }

  .board-frame {
    position: relative;
    background: var(--board-frame);
    padding: 22px;
    border-radius: 14px;
    box-shadow: 0 18px 40px -22px rgba(0,0,0,0.45);
  }

  .board-inner { display: flex; gap: 8px; }

  .rank-labels { display: flex; flex-direction: column; justify-content: space-around; }
  .rank-labels span, .file-labels span {
    color: rgba(255,255,255,0.55);
    font-size: 12px;
    font-family: var(--sans);
    width: 16px;
    text-align: center;
  }

  .board-main { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }

  .board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    aspect-ratio: 1 / 1;
    width: 100%;
    border-radius: 6px;
    overflow: hidden;
  }

  .file-labels { display: flex; justify-content: space-around; }

  .sq {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
  }
  .sq.light { background: var(--board-light); }
  .sq.dark { background: var(--board-dark); }

  .sq.selected::after {
    content: '';
    position: absolute;
    inset: 3px;
    border: 2.5px solid var(--select-ring);
    border-radius: 3px;
    pointer-events: none;
  }

  .sq.flash-good { animation: flashGood 0.6s ease; }
  .sq.flash-bad { animation: flashBad 0.5s ease; }
  @keyframes flashGood {
    0% { box-shadow: inset 0 0 0 999px rgba(127,169,133,0); }
    35% { box-shadow: inset 0 0 0 999px rgba(127,169,133,0.55); }
    100% { box-shadow: inset 0 0 0 999px rgba(127,169,133,0); }
  }
  @keyframes flashBad {
    0% { box-shadow: inset 0 0 0 999px rgba(193,118,99,0); }
    35% { box-shadow: inset 0 0 0 999px rgba(193,118,99,0.55); }
    100% { box-shadow: inset 0 0 0 999px rgba(193,118,99,0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .sq.flash-good, .sq.flash-bad { animation: none; }
  }

  .legal-dot {
    position: absolute;
    width: 26%;
    height: 26%;
    border-radius: 50%;
    background: var(--dot-color);
    box-shadow: 0 0 0 2px rgba(0,0,0,0.45), 0 0 0 3px rgba(255,255,255,0.35);
    pointer-events: none;
  }
  .legal-dot.capture {
    width: 76%;
    height: 76%;
    background: transparent;
    border: 4px solid var(--dot-color);
    box-shadow: 0 0 0 2px rgba(0,0,0,0.45), inset 0 0 0 2px rgba(255,255,255,0.3);
  }

  .piece {
    font-size: clamp(24px, 5.2vw, 44px);
    line-height: 1;
    pointer-events: none;
  }
  .white-piece {
    color: #fffaf0;
    text-shadow:
      -1.4px -1.4px 0 #14151d,
      1.4px -1.4px 0 #14151d,
      -1.4px 1.4px 0 #14151d,
      1.4px 1.4px 0 #14151d,
      0 3px 4px rgba(0,0,0,0.4);
  }
  .black-piece {
    color: #0b0b10;
    text-shadow:
      -1px -1px 0 rgba(255,255,255,0.7),
      1px -1px 0 rgba(255,255,255,0.7),
      -1px 1px 0 rgba(255,255,255,0.7),
      1px 1px 0 rgba(255,255,255,0.7),
      0 3px 4px rgba(0,0,0,0.35);
  }

  .feedback { min-height: 26px; font-size: 14.5px; color: var(--text-muted); line-height: 1.5; }
  .feedback.good { color: var(--accent-good); font-weight: 500; }
  .feedback.bad { color: var(--accent-bad); font-weight: 500; }

  .panel { display: flex; flex-direction: column; gap: 16px; }
  .panel-card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; padding: 18px 20px; }

  .score-label { font-size: 12.5px; color: var(--text-muted); margin-bottom: 4px; }
  .score-value { font-family: var(--serif); font-size: 34px; font-weight: 600; color: var(--accent-gold); line-height: 1; }

  .progress-row { display: flex; justify-content: space-between; font-size: 13.5px; color: var(--text-muted); margin-top: 14px; }
  .progress-bar { margin-top: 8px; height: 5px; border-radius: 999px; background: var(--panel-border); overflow: hidden; }
  .progress-bar-fill { height: 100%; background: var(--accent-gold); border-radius: 999px; transition: width 0.3s ease; }

  .controls { display: flex; flex-direction: column; gap: 8px; }

  button {
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--panel-border);
    background: var(--panel);
    color: var(--text-primary);
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  button:hover { border-color: var(--accent-gold); }
  button:focus-visible { outline: 2px solid var(--select-ring); outline-offset: 2px; }
  button.primary { background: var(--accent-gold); border-color: var(--accent-gold); color: #1c1408; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }

  .next-row { display: none; }
  .next-row.show { display: block; }

  .done-card { display: none; text-align: center; padding: 28px 20px; }
  .done-card.show { display: block; }
  .done-card h2 { font-family: var(--serif); font-size: 26px; margin: 0 0 8px; }
  .done-card p { color: var(--text-muted); font-size: 14.5px; margin: 0 0 18px; }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="top-row">
      <div>
        <h1 id="title-text">체스 묘수풀이</h1>
        <p id="subtitle-text"></p>
      </div>
      <div class="lang-toggle">
        <button id="lang-ko" class="lang-btn" type="button">한국어</button>
        <button id="lang-en" class="lang-btn" type="button">English</button>
      </div>
    </div>
  </header>

  <div class="layout">
    <div class="board-column">
      <div class="board-meta">
        <span class="difficulty-badge"><span id="diff-dot" class="difficulty-dot"></span><span id="diff-label"></span></span>
        <span class="prompt-text" id="prompt-text"></span>
      </div>

      <div class="board-frame">
        <div class="board-inner">
          <div class="rank-labels" id="rank-labels"></div>
          <div class="board-main">
            <div class="board" id="board"></div>
            <div class="file-labels" id="file-labels"></div>
          </div>
        </div>
      </div>

      <div class="feedback" id="feedback" aria-live="polite"></div>
    </div>

    <aside class="panel">
      <div class="panel-card">
        <div class="score-label" id="score-label-text"></div>
        <div class="score-value" id="score">0</div>
        <div class="progress-row">
          <span id="progress-text">1 / 20</span>
          <span id="turn-note-inline"></span>
        </div>
        <div class="progress-bar"><div class="progress-bar-fill" id="progress-fill" style="width:0%"></div></div>
      </div>

      <div class="panel-card controls">
        <button id="hint-btn" type="button"></button>
        <button id="reveal-btn" type="button"></button>
        <div class="next-row" id="next-row">
          <button id="next-btn" class="primary" type="button"></button>
        </div>
        <button id="reset-btn" type="button"></button>
      </div>
    </aside>
  </div>

  <div class="panel-card done-card" id="done-card">
    <h2 id="done-title"></h2>
    <p id="done-summary"></p>
    <button id="restart-btn" class="primary" type="button"></button>
  </div>
</div>

    function tryStep(nr, nc) {
      if (!inBounds(nr, nc)) return;
      const target = b[nr][nc];
      if (!target) { moves.push([nr, nc]); return; }
      if ((white && isBlack(target)) || (!white && isWhite(target))) moves.push([nr, nc]);

    function trySlide(dr, dc) {
      let nr = r + dr, nc = c + dc;
      while (inBounds(nr, nc)) {
        const target = b[nr][nc];
        if (!target) { moves.push([nr, nc]); nr += dr; nc += dc; continue; }
        if ((white && isBlack(target)) || (!white && isWhite(target))) moves.push([nr, nc]);

          span.className = 'piece ' + (isWhite(piece) ? 'white-piece' : 'black-piece');
          span.textContent = PIECE_GLYPHS[piece];
          cell.appendChild(span);
        }
        if (selected && selected[0] === r && selected[1] === c) cell.classList.add('selected');
        if (legalTargets.some(function (t2) { return t2[0] === r && t2[1] === c; })) {
          const dot = document.createElement('div');
          dot.className = 'legal-dot' + (piece ? ' capture' : '');
          cell.appendChild(dot);
        }
        cell.addEventListener('click', onSquareClick);
        boardEl.appendChild(cell);
      }
    }
  }

  function onSquareClick(e) {
    if (solved) return;
    const r = Number(e.currentTarget.dataset.r);
    const c = Number(e.currentTarget.dataset.c);
    const piece = board[r][c];

    if (selected) {
      const isTarget = legalTargets.some(function (t2) { return t2[0] === r && t2[1] === c; });
      if (isTarget) { attemptMove(selected[0], selected[1], r, c); return; }
      if (piece && ((playerColor === 'w' && isWhite(piece)) || (playerColor === 'b' && isBlack(piece)))) {
        selected = [r, c];
        legalTargets = generateMoves(board, r, c);
        render();
        return;
      }
      selected = null; legalTargets = []; render();
      return;
    }

    if (piece && ((playerColor === 'w' && isWhite(piece)) || (playerColor === 'b' && isBlack(piece)))) {
      selected = [r, c];
      legalTargets = generateMoves(board, r, c);
      render();
    }
  }

  function attemptMove(fr, fc, tr, tc) {
    const s = t();
    const p = currentPuzzle();
    const moveStr = sqName(fr, fc) + sqName(tr, tc);
    const isCorrect = p.solution.indexOf(moveStr) !== -1;
    const piece = board[fr][fc];

    if (isCorrect) {
      board[tr][tc] = piece; board[fr][fc] = null;
      selected = null; legalTargets = []; solved = true;
      render();
      flashSquare(tr, tc, 'good');
      const pts = DIFF_POINTS[p.difficulty];
      score += pts;
      scoreEl.textContent = score;
      progressFillEl.style.width = Math.round(((puzzleIndex + 1) / PUZZLES.length) * 100) + '%';
      const pieceName = s.pieces[piece.toUpperCase()];
      feedbackEl.textContent = s.correct(pieceName, sqName(fr, fc), sqName(tr, tc), pts);
      feedbackEl.className = 'feedback good';
      hintBtn.disabled = true; revealBtn.disabled = true;
      nextRow.classList.add('show');
    } else {
      flashSquare(tr, tc, 'bad');
      const penalty = WRONG_PENALTY[p.difficulty];
      score = Math.max(0, score - penalty);
      scoreEl.textContent = score;
      feedbackEl.textContent = s.wrong(penalty);
      feedbackEl.className = 'feedback bad';
      selected = null; legalTargets = [];
      render();
    }
  }

  function flashSquare(r, c, kind) {
    const idx = r * 8 + c;
    const cell = boardEl.children[idx];
    if (!cell) return;
    cell.classList.add(kind === 'good' ? 'flash-good' : 'flash-bad');
    setTimeout(function () { cell.classList.remove('flash-good', 'flash-bad'); }, 650);
  }

  hintBtn.addEventListener('click', function () {
    const s = t();
    const p = currentPuzzle();
    const [fr, fc] = rcFromSquare(p.solution[0].slice(0, 2));
    const piece = board[fr][fc];
    const pieceName = s.pieces[piece.toUpperCase()];
    feedbackEl.textContent = s.hintText(s.kindHint(p.kind, pieceName));
    feedbackEl.className = 'feedback';
  });

  revealBtn.addEventListener('click', function () {
    if (solved) return;
    const s = t();
    const p = currentPuzzle();
    const from = p.solution[0].slice(0, 2), to = p.solution[0].slice(2, 4);
    const [fr, fc] = rcFromSquare(from);
    const [tr, tc] = rcFromSquare(to);
    const piece = board[fr][fc];
    board[tr][tc] = piece; board[fr][fc] = null;
    selected = null; legalTargets = []; solved = true;
    render();
    flashSquare(tr, tc, 'good');
    const pieceName = s.pieces[piece.toUpperCase()];
    feedbackEl.textContent = s.revealText(pieceName, from, to);
    feedbackEl.className = 'feedback';
    hintBtn.disabled = true; revealBtn.disabled = true;
    nextRow.classList.add('show');
  });

  nextBtn.addEventListener('click', function () {
    puzzleIndex += 1;
    if (puzzleIndex >= PUZZLES.length) {
      document.querySelector('.layout').style.display = 'none';
      doneSummary.textContent = t().doneSummary(score, PUZZLES.length);
      doneCard.classList.add('show');
      return;
    }
    loadPuzzle();
  });

  function fullReset() {
    puzzleIndex = 0; score = 0;
    PUZZLES = pickRound();
    scoreEl.textContent = '0';
    document.querySelector('.layout').style.display = 'grid';
    doneCard.classList.remove('show');
    loadPuzzle();
  }

  resetBtn.addEventListener('click', fullReset);
  restartBtn.addEventListener('click', fullReset);
  langKoBtn.addEventListener('click', function () { setLang('ko'); });
  langEnBtn.addEventListener('click', function () { setLang('en'); });

  PUZZLES = pickRound();
  applyStaticStrings();
  loadPuzzle();
})();
</script>
</body>
</html>
